name: 自动生成苹果风索引页

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 动态生成苹果风索引页
        run: |
          echo "<html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width, initial-scale=1'>
          <title>My Archive</title>
          <style>
            :root { --bg: #f5f5f7; --card: rgba(255, 255, 255, 0.7); --text: #1d1d1f; --link: #0066cc; }
            body { font-family: -apple-system, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif; background: var(--bg); color: var(--text); margin: 0; -webkit-font-smoothing: antialiased; }
            .nav { position: sticky; top: 0; backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); background: rgba(245, 245, 247, 0.7); z-index: 100; padding: 20px; text-align: center; }
            h1 { font-size: 32px; font-weight: 600; letter-spacing: -0.5px; margin: 0; }
            .container { max-width: 680px; margin: 30px auto; padding: 0 20px; }
            .search-box { width: 100%; height: 44px; border-radius: 12px; border: none; background: #e8e8ed; padding: 0 15px; font-size: 17px; margin-bottom: 24px; outline: none; box-sizing: border-box; }
            ul { list-style: none; padding: 0; margin: 0; }
            .file-card { background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-radius: 18px; padding: 20px; margin-bottom: 16px; display: flex; align-items: center; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); text-decoration: none; color: inherit; border: 1px solid rgba(255,255,255,0.3); }
            .file-card:hover { transform: scale(1.02); background: rgba(255, 255, 255, 0.9); }
            .file-info { flex: 1; min-width: 0; }
            .file-name { display: block; font-size: 19px; font-weight: 500; color: var(--text); margin-bottom: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
            .file-meta { display: block; font-size: 13px; color: #86868b; }
            .arrow { color: #86868b; margin-left: 15px; font-size: 20px; }
            .count-tag { font-size: 14px; color: #86868b; margin-top: 8px; }
          </style></head>
          <body>
            <div class='nav'><h1>Archive</h1><div id='count' class='count-tag'>Loading...</div></div>
            <div class='container'>
              <input type='text' id='searchInput' class='search-box' placeholder='搜索文档...' onkeyup='searchFunction()'>
              <ul id='fileList'>" > index.html
          
          git ls-files -z *.html | xargs -0 -I {} git log -1 --format="%ct {}" -- "{}" | sort -rn | while read -r line; do
              timestamp=$(echo "$line" | cut -d' ' -f1)
              filename=$(echo "$line" | cut -d' ' -f2-)
              if [ "$filename" = "index.html" ]; then continue; fi
              date_str=$(TZ='Europe/Prague' date -d @"$timestamp" +"%d. %m. %Y · %H:%M")
              display_name=$(echo "$filename" | sed 's/\.html$//' | sed 's/_/ /g')
              echo "<li><a href='./$filename' class='file-card'><div class='file-info'><span class='file-name'>$display_name</span><span class='file-meta'>$date_str</span></div><div class='arrow'>›</div></a></li>" >> index.html
          done
          
          echo "</ul></div>
          <script>
            function searchFunction() {
              var input = document.getElementById('searchInput');
              var filter = input.value.toUpperCase();
              var items = document.getElementsByClassName('file-card');
              for (var i = 0; i < items.length; i++) {
                var name = items[i].getElementsByClassName('file-name')[0];
                items[i].parentElement.style.display = name.innerHTML.toUpperCase().indexOf(filter) > -1 ? '' : 'none';
              }
            }
            document.getElementById('count').innerHTML = document.getElementById('fileList').getElementsByTagName('li').length + ' 份文档';
          </script>
          </body></html>" >> index.html

      - name: 上传
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: 部署
        uses: actions/deploy-pages@v4
